name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Quick end-to-end pipeline (CPU, tiny subset)
        run: |
          start=$(date +%s)
          python -m roughvol all --quick
          echo "quick pipeline took $(( $(date +%s) - start ))s"
      - name: README numbers match results/*.json
        run: python scripts/build_readme_tables.py --check
