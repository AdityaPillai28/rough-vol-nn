# Step 1: Monte Carlo pricer and training-set generation.
seed: 20240501

grid:
  # Maturities in years. The short end (1-3 weeks) is where roughness shows up.
  maturities: [0.02, 0.05, 0.1, 0.25, 0.5, 0.75, 1.0, 1.5]
  # Strikes are log-moneyness k = z * sqrt(T); z is fixed across maturities so
  # every cell is a comparable number of standard deviations from the money.
  z: [-0.42, -0.35, -0.28, -0.21, -0.14, -0.07, 0.0, 0.07, 0.14, 0.21, 0.28]

# Parameter box (Horvath, Muguruza & Tomas 2021, rBergomi with flat forward variance).
params:
  H: [0.025, 0.5]
  eta: [0.5, 4.0]
  rho: [-0.95, -0.1]
  xi0: [0.01, 0.16]

mc:
  steps_per_year: 500      # every maturity in the grid lands exactly on a step
  n_paths: 40000           # including antithetic partners (must be even)
  estimator: mixing        # "mixing" (conditional on W1, Romano-Touzi) or "plain"
  dtype: float32           # path simulation precision; payoffs are aggregated in float64
  path_batch: 40000        # paths per GPU batch (memory knob)

generation:
  n_samples: 80000
  chunk_size: 500
  raw_dir: data/raw
  processed: data/processed/dataset.npz
  split: [0.8, 0.1, 0.1]   # train / val / test, by sample index

reference:
  # High-precision surfaces used as ground truth for the surrogate error study.
  n_samples: 256
  n_paths: 640000
  out: data/processed/reference.npz
  seed_offset: 7777
