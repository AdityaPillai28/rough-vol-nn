# --quick overrides: tiny end-to-end run on CPU in well under 5 minutes (used by CI).
# Merged on top of the other configs; outputs go to results/quick and data/quick.
data:
  mc:
    steps_per_year: 100
    n_paths: 2000
    path_batch: 2000
    dtype: float32
  generation:
    n_samples: 600
    chunk_size: 200
    raw_dir: data/quick/raw
    processed: data/quick/dataset.npz
  reference:
    n_samples: 16
    n_paths: 8000
    out: data/quick/reference.npz

surrogate:
  device: cpu
  train:
    epochs: 30
    early_stop_patience: 10
  out_dir: results/quick/models

calibration:
  lm: {max_iter: 40, n_starts: 2}
  lbfgs: {max_iter: 60, n_starts: 1}
  recovery: {n_surfaces: 40, n_lbfgs: 5}
  speed: {n_single: 5}
  mc_calibration: {n_surfaces: 1, n_paths: 2000, max_nfev: 15}

heston:
  cos: {n_terms: 128}
  calibration: {n_surfaces: 2, n_starts: 1, max_nfev: 60}
  skew:
    maturities: [0.02, 0.05, 0.1, 0.25, 0.5]
    steps_per_year: 200
    n_paths: 4000
    path_batch: 4000
    H_values: [0.1]

ablations:
  n_param_sets: 2
  discretisation: {steps_per_year: [100, 200], n_paths: 4000, path_batch: 4000}
  estimator: {n_paths: 4000}
