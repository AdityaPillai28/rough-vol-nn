# Step 3: calibration through the surrogate.
seed: 99
model: resmlp           # which trained surrogate to calibrate through

lm:
  max_iter: 100
  lambda0: 1.0e-2
  lambda_up: 10.0
  lambda_down: 0.3
  tol: 1.0e-10
  n_starts: 4           # multi-start: params drawn uniformly in the box

lbfgs:
  max_iter: 300
  n_starts: 4

recovery:
  n_surfaces: 2000      # held-out test surfaces (MC labels, i.e. realistic noise)
  n_lbfgs: 200          # L-BFGS-B is run sequentially on this many of them

speed:
  n_single: 50          # single-surface CPU calibrations timed one by one

mc_calibration:
  # Calibration with the Monte Carlo pricer in the loop, for the speed comparison.
  n_surfaces: 5
  n_paths: 40000
  max_nfev: 60
